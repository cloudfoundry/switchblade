---
name: Lint

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.22.x

    - name: Checkout
      uses: actions/checkout@v7

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.64.5
